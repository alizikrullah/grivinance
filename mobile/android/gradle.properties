# Template Flutter default minta -Xmx8G + metaspace 4G, total bisa 12 GB.
# Di mesin 16 GB yang juga jalan IDE dan browser, daemon Gradle-nya crash
# kehabisan memori. Segini cukup buat proyek ini dan jauh lebih tahan.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError
# Incremental compilation Kotlin gagal menutup cache-nya sendiri waktu meng-
# compile share_plus di mesin ini, dan build jadi gagal berulang meski folder
# build sudah bersih. Build release selalu dari nol, jadi fitur ini tidak
# memberi percepatan apa pun di sini - cuma menambah bagian yang bisa rusak.
kotlin.incremental=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
